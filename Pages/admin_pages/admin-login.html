<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMSync - Admin Login </title>
    <link rel="stylesheet" href="../../Design/admin_design/admin.css">
    <script src="../../JS/admin_js/admin-login.js"></script>
</head>
<body class="auth-body">

    <div class="auth-container">
        <div class="auth-header">
            <img src="../../Images/ems-logo.jpg">
            <h1>Welcome Back!</h1><br>
        </div>

        <form id="adminLoginForm" onsubmit="return validateLogin()">
            <fieldset>
                <legend>Login Credentials</legend>
                <table class="form-table">
                    <tr>
                        <td><label for="username">Username: </label></td>
                        <td>
                            <input type="text" id="username" placeholder="Enter username (admin)">
                        </td>
                    </tr>
                    <tr>
                        <td><label for="password">Password: </label></td>
                        <td>
                            <input type="password" id="password" placeholder="Enter password (admin)">
                        </td>
                    </tr>
                </table>
            </fieldset>

            <p id="LoginError" style="text-align: center;"></p>

            <div class="form-buttons">
                <input type="submit" id="submit" value="Login">
                <input type="reset" id="reset" value="Reset">
            </div>
        </form>

        <div class="auth-footer">
            Need an administrator account? <a href="admin-register.html">Register here</a><br><br>
            <a href="../../index.html">&larr; Back to Home</a>
        </div>
    </div>

</body>
</html>
