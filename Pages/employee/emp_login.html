<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Login</title>
    <link rel="stylesheet" href="../../Design/employee/emp_portal.css">
    <script src="../../JS/employee/emp_portal.js" defer></script>
</head>
<body>

    <header class="page-header">
        <div class="logo">
            <img src="../../Images/ems-logo.jpg" alt="EMSync Logo" height="60" width="60">
            <h3>EMSync</h3>
        </div>
    </header>

    <nav class="page-nav">
        <div class="nav-item">
            <a href="../../index.html">Home</a>
            <a href="emp_login.html" class="active">Login</a>
            <a href="emp_registration.html">Registration</a>
        </div>
    </nav>

    <main class="login-main">
        <h2>Employee Login</h2>

        <form onsubmit="return validateLogin()" onreset="clearLoginErrors()" novalidate>
            <div class="field">
                <label for="loginId">Employee ID</label>
                <input type="text" id="loginId" placeholder="Enter employee ID">
                <p id="loginIdError" class="error-message"></p>
            </div>

            <div class="field">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" placeholder="Enter password">
                <p id="loginPasswordError" class="error-message"></p>
            </div>

            <div class="checkbox-field">
                <input type="checkbox" id="rememberMe">
                <label for="rememberMe">Remember me</label>
            </div>

            <div class="form-buttons">
                <button type="submit">Login</button>
                <button type="reset" class="reset-button">Reset</button>
            </div>
        </form>

        <p class="bottom-link">Don't have an account? <a href="emp_registration.html">Register</a></p>
    </main>

    <footer>EMSync &copy; 2026</footer>
</body>
</html>
