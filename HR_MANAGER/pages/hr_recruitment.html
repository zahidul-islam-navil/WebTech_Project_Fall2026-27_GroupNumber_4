    <main class="employee_main">
        <fieldset class="employee_fieldset">

            <h2>Recruitment Management</h2>

            <div class="employee_table">

                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Applied Post</th>
                            <th>Application Status</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td>Tanvir Ahmed</td>
                            <td>Web Developer</td>
                            <td>
                                <select id="candidate1">
                                    <option>Interview</option>
                                    <option selected>Shortlisted</option>
                                    <option>Hired</option>
                                    <option>Rejected</option>
                                </select>
                            </td>
                        </tr>

                        <tr>
                            <td>Kamal Naser</td>
                            <td>UI Designer</td>
                            <td>
                                <select id="candidate2">
                                    <option>Interview</option>

                        </tr>

                            <td>Jamshed Mojumder</td>
                            <td>Software Engineer</td>
                            <td>
                                <select id="candidate3">
                                    <option selected>Interview</option>
                                    <option>Shortlisted</option>
                                    <option>Hired</option>
                                    <option>Rejected</option>
                                </select>
                            </td>
                        </tr>
                    </tbody>
                </table>

            </div>

            <div class="form_btn">
                <button type="button" onclick="updateRecruitment()">
                    Update
                </button>
            </div>

            <p id="recruitmentMessage" style="text-align: center;"></p>

        </fieldset>
    </main>
